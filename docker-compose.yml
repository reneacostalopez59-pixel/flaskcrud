services:
  db:
    image: mysql:8.0
    container_name: flaskcrud_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DB:-flaskcrud}
    ports:
      - "3307:3306"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-changeme}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: flaskcrud_web
    restart: always
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      MYSQL_USER: ${MYSQL_USER:-root}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
      MYSQL_DB: ${MYSQL_DB:-flaskcrud}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: